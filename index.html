<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ovenly Kitchen Co. Business Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="business-card">
        <div class="front-card">
            <img class="logo" src="assets/logo.png" alt="Ovenly Kitchen Co. Logo">
            
            <img class="curl-design" src="assets/curl.png" alt="">

            <h1>OVENLY</h1>
            <h2>KITCHEN CO.</h2>
            <p>Made Fresh. Served with Heart.</p>

        </div>

        <div class="back-card">
            <img class="curl-design" src="assets/curl.png" alt="">

            <div class="contact-information">
                <div class="name-position">
                    <img src="assets/person.png" alt="Person">

                    <div>
                        <h3>Josiah B. Quiñones</h3>
                        <h4>Owner</h4>
                    </div>

                </div>

                <div class="contact-item">
                    <img src="assets/call.png" alt="Call">
                    <p>+63 951 382 8902</p>
                </div>

                <div class="contact-item">
                    <img src="assets/page.png" alt="Page">
                    <p>www.ovenlykitchenco.com</p>
                </div>

                <div class="contact-item">
                    <img src="assets/email.png" alt="Email">
                    <p>ovenlykitchenco@gmail.com</p>
                </div>

                <div class="contact-item">
                    <img src="assets/location.png" alt="Location">
                    <p>Lupon, Davao Oriental Philippines</p>
                </div>

            </div>
            <img class="pizza-image" src="assets/pizza.png" alt="Pizza">
            
        </div>

    </div>

</body>
</html>
